# DEV1 FALLBACK for scenarios/benign_odd.yaml (PRD §12.2: "Priya travels to Mumbai and logs in on a new phone. She
# approves the push on her old registered phone (STEP_UP_PASSED_TRUSTED), then makes a large purchase to a known payee.
# Expected: never above MEDIUM."). Dev 2's file replaces this one when scenarios/benign_odd.yaml exists.
id: benign_odd
description: "Odd but legitimate: new phone in Mumbai, trusted push approved, large payment to a known payee"
default_start: "2026-10-09T19:10:00+05:30"
identities:
  priya_phone:    {subject: {customer_ref: C-1042, account_ref: A-88213},
                   context: {ip: 49.207.10.21, device_id: fp_priya_phone, asn: "AS24560 Airtel", city: Bengaluru, lat: 12.9716, lon: 77.5946}}
  priya_newphone: {subject: {customer_ref: C-1042, account_ref: A-88213},
                   context: {ip: 106.51.33.12, device_id: fp_priya_newphone, asn: "AS45609 Airtel", city: Mumbai, lat: 19.076, lon: 72.8777}}
preload:
  - {at_min: -43200, type: payee_added, source: simulator, as: priya_phone, payload: {payee_account: A-20001, payee_name_match: true, nickname: "Jeweller"}}
  - {at_min: -40000, type: transaction, source: simulator, as: priya_phone, payload: {amount_paise: 2500000, payee_account: A-20001, channel: UPI}}
  - {at_min: -1440,  type: login, source: simulator, as: priya_phone, payload: {result: success, auth_method: password+push}}
seeds: []
steps:
  - {at_min: 0, type: login, source: demo-bank-web, as: priya_newphone, payload: {result: success, auth_method: password+push}}
  - {at_min: 2, action: step_up_respond, channel: phone, decision: approve, as: priya_phone,
     direct_payload: {method: device_push, result: passed, factor_age_h: 2160}}
  - {at_min: 6, type: transaction, source: demo-bank-web, as: priya_newphone, payload: {amount_paise: 9500000, payee_account: A-20001, channel: UPI}}
labels: {attack_id: null, is_attack: false}
