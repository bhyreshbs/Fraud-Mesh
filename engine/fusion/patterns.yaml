# PRD §10.5 sequence patterns. Each matches at most once per case and adds its bonus (log-odds units).
- id: pat_ATO1
  label: "New-device login followed by an MFA or profile change"
  sequence: [S1_INITIAL_ACCESS, S2_CONTROL_TAKEOVER]   # the S2 evidence must come after the S1 evidence
  within_min: 30
  bonus: 0.5
- id: pat_CASE_IP_CLOUD
  label: "Cloud action from an IP already seen in this case"
  when_detector: cyber
  shares_entity_kind_with_earlier_evidence: ip
  bonus: 0.3
# DEV1 FW (pending Dev 2 review): authorised push payment (APP) scam signature, scenarios/scam_app.yaml.
# A payee whose name check failed, paid within 30 minutes, in a case with no account-takeover (S2) evidence: the genuine
# customer is moving the money herself. policy.yaml's app_scam_hold rule keys on this id.
- id: pat_APP_SCAM1
  label: "Payment minutes after adding a payee whose name check failed, with no takeover signs"
  sequence: [S5_POSITIONING, S6_MONETIZATION]
  first_reason_any: [PAYEE_NAME_MISMATCH]
  absent_stages: [S2_CONTROL_TAKEOVER]
  within_min: 30
  bonus: 1.0
# v3 core (3.1b): the slow account takeover. New-device login (S1) → MFA / SMS / security change (S2) → payee positioned
# (S5), each step after the previous one and the whole chain within 24 h. Not evaluated when pat_ATO1 (S1 → S2 within
# 30 min) already matched, so a fast takeover is not rewarded twice for one S1 → S2 link; that also keeps the PRD §12.4
# golden case (which matches pat_ATO1) exact.
- id: pat_ATO2
  label: "New-device login, then a security change, then a new payee, all within 24 hours"
  sequence: [S1_INITIAL_ACCESS, S2_CONTROL_TAKEOVER, S5_POSITIONING]
  within_min: 1440
  total_within_min: 1440
  unless_patterns: [pat_ATO1]
  bonus: 0.5
