# PRD §10.8 — evaluated top to bottom, first match wins.
- id: critical
  when: {band: CRITICAL}
  actions: [BLOCK_PENDING_PAYMENTS, FREEZE_NEW_PAYEES, REVOKE_SESSIONS, OPEN_CASE_P1]
# v3 core (engine/fusion/fusion.py floors, thresholds in engine/detectors/rules/v3_core.yaml): the HIGH actions, under a
# rule id that records which floor escalated the case. A floor only ever raises the band to HIGH, so a CRITICAL case
# still takes `critical` above.
- id: ato_new_payee_hold
  when: {floor_any: [floor_S2_THEN_NEW_PAYEE]}
  actions: [HOLD_OUTBOUND_PAYMENTS, STEP_UP_TRUSTED_FACTOR, OPEN_CASE_P2]
- id: txn_high_confidence_hold
  when: {floor_any: [floor_TXN_HIGH_CONFIDENCE]}
  actions: [HOLD_OUTBOUND_PAYMENTS, STEP_UP_TRUSTED_FACTOR, OPEN_CASE_P2]
# v3 graph/scam (docs/v3_policy_requests.yaml): an APP-scam cooling-off holds the payment even after the genuine
# customer's own trusted step-up lowers P (OTP / push approval does not clear scam risk). No STEP_UP here: `high` on the
# same transfer still asks the trusted push. HOLD_OUTBOUND_PAYMENTS sets the payment state (policy.py knows HOLD/BLOCK).
- id: app_scam_cooling_off
  when: {reason_any: [APP_SCAM_COOLING_OFF]}
  actions: [COOLING_OFF_HOLD, HOLD_OUTBOUND_PAYMENTS, SCAM_WARNING, OPEN_CASE_P2]
- id: high
  when: {band: HIGH}
  actions: [HOLD_OUTBOUND_PAYMENTS, STEP_UP_TRUSTED_FACTOR, OPEN_CASE_P2]
# DEV1 FW (pending Dev 2 review): a case with the APP-scam signature gets the HIGH actions below HIGH too. In an
# authorised push payment scam the genuine customer passes the trusted push (it proves identity, not intent), which
# lowers P; the hold must survive that. The push is still asked once (it is where the bank's scam warning is shown);
# a step-up already in the previous decision is not asked again (§10.8), so an analyst follows up (OPEN_CASE_P2).
- id: app_scam_hold
  when: {pattern_any: [pat_APP_SCAM1]}
  actions: [HOLD_OUTBOUND_PAYMENTS, STEP_UP_TRUSTED_FACTOR, OPEN_CASE_P2]
# v3 graph/insider: a staff change right after a new-device login on the customer holds payments whatever the
# source IP (IP trust is not authorization).
- id: insider_staff_change
  when: {reason_any: [INSIDER_CHANGE_AFTER_NEW_DEVICE_LOGIN]}
  actions: [HOLD_OUTBOUND_PAYMENTS, OPEN_CASE_P1]
- id: app_scam_warning_medium
  when: {band: MEDIUM, reason_any: [APP_SCAM_WARNING]}
  actions: [SCAM_WARNING, STEP_UP_ANY_FACTOR]
- id: medium
  when: {band: MEDIUM}
  actions: [STEP_UP_ANY_FACTOR]
- id: app_scam_warning
  when: {reason_any: [APP_SCAM_WARNING]}
  actions: [SCAM_WARNING, OPEN_CASE_P2]
- id: credential_stuffing
  when: {band: LOW, reason_any: [CREDENTIAL_STUFFING_IP]}
  actions: [CAPTCHA_CHALLENGE]
# v3 network/session: distributed credential stuffing gets a CAPTCHA; a suspicious session-context change (network
# AND device context changed inside one session) asks a step-up. Both are weak signals: never a block on their own.
- id: distributed_stuffing
  when: {band: LOW, reason_any: [ACCOUNT_DISTRIBUTED_FAILURES, ACCOUNT_LOW_SLOW_FAILURES, DEVICE_MULTI_ACCOUNT_FAILURES, GLOBAL_LOGIN_FAILURE_SPIKE]}
  actions: [CAPTCHA_CHALLENGE]
- id: session_context_change
  when: {band: LOW, reason_any: [SESSION_CONTEXT_CHANGE]}
  actions: [STEP_UP_ANY_FACTOR]
- id: low
  when: {band: LOW}
  actions: [ALLOW]
