# PRD §14.2
name: ci
on:
  pull_request:
  push:
    branches: [main]

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: fm, POSTGRES_PASSWORD: fm, POSTGRES_DB: fraudmesh }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fm" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgresql+psycopg://fm:fm@localhost:5432/fraudmesh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r api/requirements.txt -r engine/requirements.txt ruff
      - name: Contract hash
        run: python scripts/verify_contracts.py
      - name: Import boundary (engine must not import api/scripts)
        run: "! grep -rnE '^(from|import) (api|scripts)' engine/"
      - name: Engine clock (no wall clock in engine)
        run: "! grep -rnE 'datetime.now|datetime.utcnow|time.time\(\)' engine/"
      - name: Lint
        run: ruff check .
      - name: Engine tests (MemoryStore)
        run: if [ -d tests/engine ] && ls tests/engine/test_*.py >/dev/null 2>&1; then pytest tests/engine -q; else echo "no engine tests yet"; fi
      - name: API tests
        run: pytest tests/api -q
      - name: Store contract (PgStore)
        run: if [ -f tests/engine/test_store_contract.py ]; then STORE=pg pytest tests/engine/test_store_contract.py -q; else echo "store contract test not merged yet"; fi

  frontend:
    runs-on: ubuntu-latest
    strategy:
      matrix: { app: [web, bank-demo] }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20", cache: npm, cache-dependency-path: "${{ matrix.app }}/package-lock.json" }
      - run: npm ci && npm run build
        working-directory: ${{ matrix.app }}
