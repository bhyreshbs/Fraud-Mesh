# PRD §14.2. Runs on every pushed branch (main, v2, v3, …) and on pull requests.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fm
          POSTGRES_PASSWORD: fm
          POSTGRES_DB: fraudmesh
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fm"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgresql+psycopg://fm:fm@localhost:5432/fraudmesh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            engine/requirements.txt

      - name: Install
        run: pip install -r api/requirements.txt -r engine/requirements.txt ruff

      - name: Contract hash
        run: python scripts/verify_contracts.py

      - name: Import boundary (engine must not import api or scripts)
        run: |
          if grep -rnE '^(from|import) (api|scripts)' engine/; then
            echo "engine/ imports api/ or scripts/"; exit 1
          fi

      - name: Engine clock (no wall clock in engine)
        run: |
          if grep -rnE 'datetime[.]now|datetime[.]utcnow|time[.]time[(][)]' engine/; then
            echo "engine/ uses the wall clock"; exit 1
          fi

      - name: Lint
        run: ruff check .

      - name: Engine tests (MemoryStore)
        run: |
          if ls tests/engine/test_*.py >/dev/null 2>&1; then
            pytest tests/engine -q
          else
            echo "no engine tests yet (Dev 2)"
          fi

      - name: API tests
        run: pytest tests/api -q

      - name: Integration tests (PRD §12.4) - real engine
        run: pytest tests/integration -q

      - name: Store contract (PgStore)
        run: |
          if [ -f tests/engine/test_store_contract.py ]; then
            STORE=pg pytest tests/engine/test_store_contract.py -q
          else
            echo "store contract test not merged yet (Dev 2)"
          fi

  e2e:
    # PRD §14.5 smoke test + §15.7 perf against a real uvicorn + Postgres on a Linux runner
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fm
          POSTGRES_PASSWORD: fm
          POSTGRES_DB: fraudmesh
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fm"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            engine/requirements.txt

      - name: Install, configure, migrate, seed
        run: |
          pip install -r api/requirements.txt -r engine/requirements.txt
          python scripts/make_env.py
          alembic -c api/db/alembic.ini upgrade head
          python scripts/seed_users.py

      - name: Smoke test, all three scenarios - real engine (small background per reset)
        env:
          FM_BG_DAYS: "2"
          FM_BG_CUSTOMERS: "50"
        run: |
          nohup uvicorn api.main:app --port 8000 --env-file .env --log-level warning > api-engine.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:8000/v1/health && break; sleep 1; done
          curl -s localhost:8000/v1/health | grep -q '"pipeline_ready":true'
          python scripts/smoke_test.py --all --speed 120

      - name: Perf - real engine, decision p95 < 150 ms at 50 events/s
        # The load generator runs at lower CPU priority: on the 2-vCPU runner it otherwise competes with the API
        # it measures (real clients never run on the server). perf.py still fails if it sends < 95% of 50/s.
        run: nice -n 10 python scripts/perf.py --rate 50 --seconds 120

      - name: API logs
        if: always()
        run: tail -n 60 api-*.log || true

  slow:
    # PRD §12.3 / §15.5: the full demo reset (14 d x 2000 customers, ~62k events through PgStore + engine) < 240 s
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fm
          POSTGRES_PASSWORD: fm
          POSTGRES_DB: fraudmesh
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fm"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgresql+psycopg://fm:fm@localhost:5432/fraudmesh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            engine/requirements.txt
      - run: pip install -r api/requirements.txt -r engine/requirements.txt
      - name: Full PRD reset under 4 minutes
        run: FM_RUN_SLOW=1 pytest tests/api/test_demo_tooling.py -k full_prd_reset -s

  frontend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [web, bank-demo]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install and build
        working-directory: ${{ matrix.app }}
        run: |
          npm ci
          npm run build
