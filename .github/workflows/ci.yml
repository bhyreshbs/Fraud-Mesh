# PRD §14.2. Runs on every pushed branch (main, v2, v3, …) and on pull requests.
name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fm
          POSTGRES_PASSWORD: fm
          POSTGRES_DB: fraudmesh
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fm"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgresql+psycopg://fm:fm@localhost:5432/fraudmesh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            engine/requirements.txt

      - name: Install
        run: pip install -r api/requirements.txt -r engine/requirements.txt ruff

      - name: Contract hash
        run: python scripts/verify_contracts.py

      - name: Import boundary (engine must not import api or scripts)
        run: |
          if grep -rnE '^(from|import) (api|scripts)' engine/; then
            echo "engine/ imports api/ or scripts/"; exit 1
          fi

      - name: Engine clock (no wall clock in engine)
        run: |
          if grep -rnE 'datetime[.]now|datetime[.]utcnow|time[.]time[(][)]' engine/; then
            echo "engine/ uses the wall clock"; exit 1
          fi

      - name: Lint
        run: ruff check .

      - name: Engine tests (MemoryStore)
        run: |
          if ls tests/engine/test_*.py >/dev/null 2>&1; then
            pytest tests/engine -q
          else
            echo "no engine tests yet (Dev 2)"
          fi

      - name: API tests
        run: pytest tests/api -q

      - name: Store contract (PgStore)
        run: |
          if [ -f tests/engine/test_store_contract.py ]; then
            STORE=pg pytest tests/engine/test_store_contract.py -q
          else
            echo "store contract test not merged yet (Dev 2)"
          fi

  frontend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [web, bank-demo]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install and build
        working-directory: ${{ matrix.app }}
        run: |
          npm ci
          npm run build
