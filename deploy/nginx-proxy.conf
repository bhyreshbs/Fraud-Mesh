# TLS reverse proxy for the local Docker demo (README "Transport security and keys").
# It is the only service that publishes ports, on the PRD §4 port numbers:
#   https://localhost:8000  API (+ wss:// /v1/stream); mutual TLS required for POST /v1/events and /v1/events/batch
#   https://localhost:5173  investigator console        https://localhost:5174  bank demo
# Certificates come from scripts/make_certs.py (data/certs, mounted read-only at /etc/nginx/certs).
# Installed as /etc/nginx/conf.d/default.conf, i.e. inside the stock nginx.conf's http { } block.

server_tokens off;

# ------------------------------------------------------------------ TLS
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-CHACHA20-POLY1305;
ssl_prefer_server_ciphers off;
ssl_ecdh_curve X25519:prime256v1:secp384r1;
ssl_session_cache shared:fm_tls:10m;
ssl_session_timeout 1h;
ssl_session_tickets off;
ssl_certificate     /etc/nginx/certs/server.crt;
ssl_certificate_key /etc/nginx/certs/server.key;

# ------------------------------------------------------------------ slowloris / flood limits
client_header_timeout 10s;
client_body_timeout 10s;
send_timeout 10s;
# keepalive_timeout 15s is set per server: the stock nginx.conf already sets it at http level
keepalive_requests 1000;
client_max_body_size 8m;                   # = the API's /v1/events/batch cap
client_header_buffer_size 4k;
large_client_header_buffers 4 16k;
reset_timedout_connection on;

limit_conn_zone $binary_remote_addr zone=fm_conn:10m;
limit_req_zone  $binary_remote_addr zone=fm_api:10m rate=200r/s;    # perf.py posts 50 events/s from one IP
limit_req_zone  $binary_remote_addr zone=fm_spa:10m rate=50r/s;
limit_conn_status 429;
limit_req_status 429;

# API-wide: buffer whole requests here before uvicorn sees them, so slow clients only ever cost nginx a connection
proxy_request_buffering on;
proxy_buffering on;
proxy_http_version 1.1;
proxy_connect_timeout 5s;
proxy_read_timeout 60s;
proxy_send_timeout 60s;

map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      '';
}

upstream fm_api  { server api:8000;  keepalive 16; }
upstream fm_web  { server web:80;    keepalive 8; }
upstream fm_bank { server bank:80;   keepalive 8; }

# ------------------------------------------------------------------ API :8000
server {
  listen 8000 ssl;
  http2 on;
  keepalive_timeout 15s;
  server_name localhost api proxy 127.0.0.1;

  # plain http:// sent to a TLS port: nginx raises 497; answer with a redirect to https on the same port
  error_page 497 =301 https://$host:$server_port$request_uri;

  # mutual TLS: offered to every client, required (below) only for the event-ingestion routes
  ssl_client_certificate /etc/nginx/certs/ca.crt;
  ssl_verify_client optional;
  ssl_verify_depth 1;

  limit_conn fm_conn 100;
  limit_req zone=fm_api burst=400 nodelay;

  # the API sends its own security headers (api/middleware.py); HSTS is set here once, with always
  proxy_hide_header Strict-Transport-Security;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  # client-sent copies are always overwritten: only this proxy says whether a certificate was verified
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Client-Cert-Verify $ssl_client_verify;
  proxy_set_header X-Client-Cert-DN $ssl_client_s_dn;
  proxy_set_header Connection "";

  location = /v1/events {
    if ($ssl_client_verify != SUCCESS) {
      return 403 '{"error":{"code":"FORBIDDEN","message":"a client certificate issued by the FraudMesh CA is required","request_id":"req_$request_id"}}';
    }
    proxy_pass http://fm_api;
  }

  location = /v1/events/batch {
    if ($ssl_client_verify != SUCCESS) {
      return 403 '{"error":{"code":"FORBIDDEN","message":"a client certificate issued by the FraudMesh CA is required","request_id":"req_$request_id"}}';
    }
    proxy_pass http://fm_api;
  }

  location = /v1/stream {
    proxy_pass http://fm_api;
    # proxy_set_header here replaces (does not extend) the server-level list, so it is repeated in full
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Client-Cert-Verify $ssl_client_verify;
    proxy_set_header X-Client-Cert-DN $ssl_client_s_dn;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 1h;                 # the API closes the socket itself when the access token expires
    proxy_send_timeout 1h;
    proxy_buffering off;
  }

  location / {
    proxy_pass http://fm_api;
  }

  default_type application/json;
}

# ------------------------------------------------------------------ console :5173
server {
  listen 5173 ssl;
  http2 on;
  keepalive_timeout 15s;
  server_name localhost web proxy 127.0.0.1;
  error_page 497 =301 https://$host:$server_port$request_uri;

  limit_conn fm_conn 100;
  limit_req zone=fm_spa burst=200 nodelay;
  client_max_body_size 16k;              # static files only

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  proxy_set_header Host $host;
  proxy_set_header Connection "";

  location / {
    limit_except GET HEAD { deny all; }
    proxy_pass http://fm_web;
  }
}

# ------------------------------------------------------------------ bank demo :5174
server {
  listen 5174 ssl;
  http2 on;
  keepalive_timeout 15s;
  server_name localhost bank proxy 127.0.0.1;
  error_page 497 =301 https://$host:$server_port$request_uri;

  limit_conn fm_conn 100;
  limit_req zone=fm_spa burst=200 nodelay;
  client_max_body_size 16k;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  proxy_set_header Host $host;
  proxy_set_header Connection "";

  location / {
    limit_except GET HEAD { deny all; }
    proxy_pass http://fm_bank;
  }
}
