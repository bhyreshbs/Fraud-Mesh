name: fraudmesh

# Local Docker demo with TLS everywhere (README "Transport security and keys").
# Run `python scripts/make_certs.py` once first: it writes the local CA, the server/client certificates and the
# Ed25519 keys under data/ (gitignored), which are mounted read-only below.
#
#   https://localhost:8000  API          https://localhost:5173  console          https://localhost:5174  bank app
#   postgres on 127.0.0.1:5432 (TLS required for TCP)
#
# Only `proxy` (and db, on loopback) publish ports; api, web and bank are reachable on the internal network only.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: fm
      POSTGRES_PASSWORD: fm
      POSTGRES_DB: fraudmesh
    # The server key must be owned by postgres and 0600, which a Windows/macOS bind mount cannot express: copy the
    # mounted cert and key into place with the right owner and mode, then start postgres with TLS on and our pg_hba.
    command:
      - sh
      - -c
      - >-
        install -o postgres -g postgres -m 0600 /certs/server.key /var/lib/postgresql/server.key &&
        install -o postgres -g postgres -m 0644 /certs/server.crt /var/lib/postgresql/server.crt &&
        exec docker-entrypoint.sh postgres
        -c ssl=on
        -c ssl_cert_file=/var/lib/postgresql/server.crt
        -c ssl_key_file=/var/lib/postgresql/server.key
        -c ssl_min_protocol_version=TLSv1.2
        -c hba_file=/etc/postgresql/pg_hba.conf
    ports:
      - "127.0.0.1:5432:5432"            # loopback only; host tools negotiate TLS (libpq sslmode=prefer by default)
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../data/certs/server.crt:/certs/server.crt:ro
      - ../data/certs/server.key:/certs/server.key:ro
      - ./pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fm -d fraudmesh"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build:
      context: ..
      dockerfile: deploy/api.Dockerfile
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://fm:fm@db:5432/fraudmesh?sslmode=verify-full&sslrootcert=/app/data/certs/ca.crt
      FM_TLS: "1"                          # Secure refresh cookie
      FM_INGEST_AUTH: any                  # hmac | ed25519 | any (accept both; set ed25519 to refuse HMAC)
      FM_JWT_ALG: EdDSA                    # access tokens signed with data/keys/jwt.key
      FM_JWT_PRIVATE_KEY: /app/data/keys/jwt.key
      FM_JWT_PUBLIC_KEY: /app/data/keys/jwt.pub
      FM_SIGNING_KEY_DIR: /app/data/keys          # server-side signing (/v1/demo/emit, step-up results, autopilot)
      FM_SIGNING_PUBLIC_KEY_DIR: /app/data/keys   # sender public keys for Ed25519 verification
      FM_REQUIRE_CLIENT_CERT: "1"          # /v1/events* must have come through the proxy with a verified client cert
      CORS_ORIGINS: https://localhost:5173,https://localhost:5174
    # Not published: only the proxy reaches it. That is what makes --forwarded-allow-ips '*' (trust X-Forwarded-For
    # from any peer) and the proxy's X-Client-Cert-* headers safe to trust.
    expose:
      - "8000"
    volumes:
      - ../data/keys:/app/data/keys:ro
      - ../data/certs/ca.crt:/app/data/certs/ca.crt:ro
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
      args:
        APP_DIR: web
        VITE_API_BASE: https://localhost:8000
    expose:
      - "80"
    security_opt: ["no-new-privileges:true"]
    depends_on: [api]

  bank:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
      args:
        APP_DIR: bank-demo
        VITE_API_BASE: https://localhost:8000
    expose:
      - "80"
    security_opt: ["no-new-privileges:true"]
    depends_on: [api]

  proxy:
    image: nginx:1.27-alpine
    ports:
      - "8000:8000"
      - "5173:5173"
      - "5174:5174"
    volumes:
      - ./nginx-proxy.conf:/etc/nginx/conf.d/default.conf:ro
      - ../data/certs/server.crt:/etc/nginx/certs/server.crt:ro      # the CA and client private keys stay on the host
      - ../data/certs/server.key:/etc/nginx/certs/server.key:ro
      - ../data/certs/ca.crt:/etc/nginx/certs/ca.crt:ro
    security_opt: ["no-new-privileges:true"]
    depends_on: [api, web, bank]

volumes:
  pgdata:
