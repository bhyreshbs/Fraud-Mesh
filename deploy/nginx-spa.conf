# Serves one built SPA (web/ or bank-demo/) on the internal network. Only the TLS proxy (deploy/nginx-proxy.conf)
# publishes it, on https://localhost:5173 (console) and https://localhost:5174 (bank app).
server {
  listen 80;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;

  # Everything the apps load is bundled and self-hosted (Vite build, @fontsource fonts, material-symbols, three.js,
  # cytoscape, FingerprintJS OSS, which computes the visitor id locally). The API and its WebSocket are the only other
  # origins. 'unsafe-inline' for styles only: React style={...} attributes. No inline or remote scripts.
  # (FingerprintJS's optional 0.1%-sampled usage ping to openfpcdn.io is blocked by connect-src; the demo is offline.)
  set $csp "default-src 'self'; connect-src 'self' https://localhost:8000 wss://localhost:8000; img-src 'self' data:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests";

  add_header Content-Security-Policy $csp always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Frame-Options DENY always;
  add_header Cross-Origin-Opener-Policy same-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

  location / {
    try_files $uri $uri/ /index.html;
  }
}
