# PostgreSQL client authentication for the Docker demo (deploy/docker-compose.yml, db service).
# TCP connections must use TLS (hostssl) and a SCRAM password; plain-TCP connections are rejected.
# TYPE      DATABASE  USER  ADDRESS      METHOD
local       all       all                trust            # Unix socket inside the container only (init, pg_isready)
hostssl     all       all   0.0.0.0/0    scram-sha-256
hostssl     all       all   ::/0         scram-sha-256
hostnossl   all       all   0.0.0.0/0    reject
hostnossl   all       all   ::/0         reject
